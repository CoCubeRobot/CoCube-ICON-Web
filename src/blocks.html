		<!-- Start IDE when page is loaded -->
		<script>
			var world, mbEditor;
			window.onload = async function () {
                await window.CoCubeEditorReady;
				var FPS = 60,
					lastTime = 0,
					lastStep = 0,

				// Morphic UI loop
				loop = (timestamp) => {
					requestAnimationFrame(loop);
					if (timestamp - lastStep >= 250) { // four times a second, as GP steps its scripter
						lastStep = timestamp;
						MB_editor.step();
					}
					if (timestamp - lastTime < 1000 / FPS) {
						return;
					}
					world.doOneCycle();
					lastTime = Math.max(
						lastTime + 1000 / FPS,
						timestamp - 1000 / FPS
					);
				};

				setTimeout(() => {
					// Hack: Wait a bit before starting to let everything finish loading...
					IDE.init();
					world = new WorldMorph(document.getElementById('world-canvas'), false);
					mbEditor = MB_editor.open(world, true);
					IDE.resize(); // place the world canvas over the workspace slot
					mbEditor.initializeIconCanvas(); // use the final visible canvas size
                    window.dispatchEvent(new Event("cocube-editor-ready"));
					requestAnimationFrame(loop);
				}, 500);
			};
		</script>
